[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdflens-quality-judge"
version = "0.1.0"
description = "Standalone evidence-based quality evaluation for PDFLens PDF, DOCX, metadata and assets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pymupdf>=1.24,<2",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["judge_app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
